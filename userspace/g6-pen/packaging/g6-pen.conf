# Production-safe default: consume/validate cycles but emit no pen proximity.
# Enable only after the HEAT position and presence mapping is validated against
# a clock-aligned Windows processor corpus.
hover.enabled=false

# P2 synthesized logical coordinate space.
pen.x_max=27388
pen.y_max=18258

# A reset/suspend requires a decoded clear frame before reacquisition.  Two
# positive/negative core frames debounce normal approach and tracking-close.
tracking.acquire_frames=2
tracking.release_frames=2
tracking.stale_ms=50

# Decoder/presence settings are intentionally absent.  The evidence-backed
# ff00-0c-max-energy coarse decoder must not be enabled until energy thresholds
# separate real presence from the signal that persists after software lift.
# See README.md and tests/corpus/synthetic-hover.conf for the test-only schema.
