wireplumber.profiles = {
  main = {
    monitor.v4l2 = disabled
    monitor.libcamera = optional
  }
}

monitor.libcamera.rules = [
  {
    # SP11 IR camera (vd55g1, .../ir-camera@60): reserved for howdy
    # direct-V4L2 access; hide from the PipeWire graph, but keep a clear
    # description for diagnostics and for any future policy change.
    matches = [
      { node.name = "~^libcamera_input[.]" api.libcamera.path = "~.*ir-camera@60" }
    ]
    actions = {
      update-props = {
        node.description = "Built-in IR Front Camera"
        node.nick = "SP11 IR"
        node.disabled = true
      }
    }
  }
  {
    # SP11 front RGB camera (imx681, .../camera@10): primary portal camera.
    matches = [
      { node.name = "~^libcamera_input[.]" api.libcamera.path = "~.*camera@10" }
    ]
    actions = {
      update-props = {
        node.description = "Built-in Front RGB Camera"
        node.nick = "SP11 Front RGB"
        priority.session = 1000
      }
    }
  }
]
