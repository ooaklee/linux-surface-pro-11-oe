wireplumber.profiles = {
  main = {
    monitor.v4l2 = disabled
    monitor.libcamera = optional
  }
}

monitor.libcamera.rules = [
  {
    # SP11 IR camera (vd55g1, .../ir-camera@60): keep out of the default
    # desktop webcam list. Direct-V4L2 access remains available to any
    # compatible consumer; this policy does not reserve it for an application.
    matches = [
      { node.name = "~^libcamera_input[.]" api.libcamera.path = "~.*ir-camera@60" }
    ]
    actions = {
      update-props = {
        node.description = "Built-in IR Front Camera"
        node.nick = "SP11 IR"
        node.disabled = true
      }
    }
  }
  {
    # SP11 front RGB camera (imx681, .../camera@10): primary portal camera.
    # Match the complete final path component, excluding rear-camera@10.
    matches = [
      { node.name = "~^libcamera_input[.]" api.libcamera.path = "~.*/camera@10$" }
    ]
    actions = {
      update-props = {
        node.description = "Built-in Front RGB Camera"
        node.nick = "SP11 Front RGB"
        priority.session = 1000
      }
    }
  }
  {
    # SP11 rear RGB camera (ov13858, .../rear-camera@10).
    matches = [
      { node.name = "~^libcamera_input[.]" api.libcamera.path = "~.*/rear-camera@10$" }
    ]
    actions = {
      update-props = {
        node.description = "Built-in Rear RGB Camera"
        node.nick = "SP11 Rear RGB"
        priority.session = 900
      }
    }
  }
]
