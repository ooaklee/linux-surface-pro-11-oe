version: 2

project_name: linux-armer
dist: cli/linux-armer/dist

gomod:
  dir: cli/linux-armer

builds:
  - id: linux-armer
    dir: cli/linux-armer
    main: ./cmd/linux-armer
    binary: linux-armer
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - >-
        -s -w
        -X github.com/ooaklee/linux-surface-pro-11-oe/cli/linux-armer/internal/version.Version={{ .Version }}
        -X github.com/ooaklee/linux-surface-pro-11-oe/cli/linux-armer/internal/version.Commit={{ .FullCommit }}
        -X github.com/ooaklee/linux-surface-pro-11-oe/cli/linux-armer/internal/version.Date={{ .Date }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: release-archives
    ids:
      - linux-armer
    formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}
    files:
      - src: cli/linux-armer/README.md
        strip_parent: true
      - src: cli/linux-armer/CHANGELOG.md
        strip_parent: true
      - src: cli/linux-armer/supported-isos.json
        strip_parent: true
      - src: cli/linux-armer/supported-userspace.json
        strip_parent: true
      - src: cli/linux-armer/tools/collect-sp11-windows-handoff.ps1
        strip_parent: true
      - src: "{{ .Env.LINUX_ARMER_LICENCE_DOCUMENT }}"
        strip_parent: true
      - src: "{{ .Env.LINUX_ARMER_THIRD_PARTY_NOTICES_DOCUMENT }}"
        strip_parent: true

checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  draft: false
  make_latest: false
