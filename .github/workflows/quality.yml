name: Quality

on:
  pull_request:
  push:
    branches:
      - main
      - "lsp11-x-**"

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install static-analysis tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            e2fsprogs gdisk libdigest-sha-perl mtools parted shellcheck sleuthkit \
            xz-utils zstd

      - name: Check shell syntax
        run: git ls-files -z '*.sh' | xargs -0 -n1 bash -n

      - name: Check safety-critical shell scripts
        run: |
          shellcheck --severity=error \
            scripts/boot-sp11-kernel-once.sh \
            scripts/build-sp11-live-usb-image.sh \
            scripts/build-sp11-qcom-x1e-kernel.sh \
            scripts/build-sp11-qcom-x1e-kernel-docker.sh \
            scripts/build-sp11-touchscreen-modules.sh \
            scripts/collect-sp11-feature-parity-inventory.sh \
            scripts/extract-sp11-image-bindings.sh \
            scripts/install-sp11-support.sh \
            scripts/install-sp11-touchscreen.sh \
            scripts/prepare-sp11-installed-system.sh \
            scripts/prepare-sp11-image-release-assets.sh \
            scripts/prepare-sp11-kernel-release-assets.sh \
            scripts/prepare-sp11-audio-release-assets.sh \
            scripts/regenerate-qcom-x1e-annotations.sh \
            scripts/sp11-audio-topology.sh \
            scripts/sp11-immutable-apt.sh \
            scripts/test-sp11-kernel-patches.sh \
            scripts/validate-sp11-kernel-baseline.sh \
            scripts/validate-sp11-kernel-fork-refs.sh \
            scripts/validate-sp11-payload-identity-list.sh \
            scripts/validate-sp11-public-content.sh \
            scripts/validate-sp11-source-ledger.sh \
            scripts/validate-sp11-touchscreen-release.sh \
            tests/test-boot-sp11-kernel-once.sh \
            tests/test-inventory-redaction.sh \
            tests/test-kernel-release-provenance.sh \
            tests/test-kernel-docker-wrapper-path-safety.sh \
            tests/test-kernel-source-commit-guard.sh \
            tests/test-prepare-sp11-installed-system-path-safety.sh \
            tests/test-regenerate-qcom-x1e-annotations-path-safety.sh \
            tests/test-sp11-git-boundary-sanitization.sh \
            tests/test-install-sp11-support-stubble-retirement.sh \
            tests/test-source-archive-bindings.sh \
            tests/test-sp11-image-release-source-gate.sh \
            tests/test-sp11-image-binding-extractor.sh \
            tests/test-sp11-live-image-path-safety.sh \
            tests/test-sp11-module-signature-policy.sh \
            tests/test-sp11-support-tree-binding.sh \
            tests/test-sp11-audio-topology.sh \
            tests/test-install-sp11-touchscreen-path-safety.sh \
            tests/test-touchscreen-module-source-provenance.sh

      - name: Check Python helper syntax
        run: |
          python3 -c 'from pathlib import Path; [compile(path.read_text(), str(path), "exec") for path in (Path("scripts/compare-sp11-kernel-builds.py"), Path("scripts/compare-sp11-kernel-raw-builds.py"), Path("scripts/sp11-support-tree-manifest.py"), Path("scripts/sp11-release-tree-state.py"), Path("scripts/validate-sp11-image-build-manifest.py"), Path("scripts/validate-sp11-module-signatures.py"), Path("scripts/validate-sp11-source-archive.py"), Path("scripts/validate-sp11-image-release-manifests.py"), Path("scripts/validate-sp11-oci-index.py"), Path("scripts/write-sp11-apt-provenance.py"), Path("scripts/sp11-kernel-build-inputs.py"), Path("tests/test-sp11-immutable-apt-provenance.py"), Path("tests/test-sp11-kernel-build-comparison.py"), Path("tests/test-sp11-kernel-raw-build-comparison.py"))]'

      - name: Validate provenance ledger
        run: |
          ./scripts/validate-sp11-source-ledger.sh
          ./scripts/validate-sp11-kernel-baseline.sh

      - name: Validate public thin-fork refs
        run: ./scripts/validate-sp11-kernel-fork-refs.sh

      - name: Validate public-content boundaries
        run: ./scripts/validate-sp11-public-content.sh

      - name: Test inventory redaction
        run: ./tests/test-inventory-redaction.sh

      - name: Test one-shot kernel boot guard
        run: ./tests/test-boot-sp11-kernel-once.sh

      - name: Test kernel source-commit guard
        run: ./tests/test-kernel-source-commit-guard.sh

      - name: Test hostile Git environment boundaries
        run: ./tests/test-sp11-git-boundary-sanitization.sh

      - name: Test annotations regeneration path safety
        run: ./tests/test-regenerate-qcom-x1e-annotations-path-safety.sh

      - name: Test installed-system preparation path safety
        run: ./tests/test-prepare-sp11-installed-system-path-safety.sh

      - name: Test source archive identity guard
        run: ./tests/test-source-archive-bindings.sh

      - name: Test touchscreen module source and header provenance guard
        run: ./tests/test-touchscreen-module-source-provenance.sh

      - name: Test touchscreen installer path safety and rollback
        run: ./tests/test-install-sp11-touchscreen-path-safety.sh

      - name: Test kernel release provenance guard
        run: ./tests/test-kernel-release-provenance.sh

      - name: Test kernel Docker wrapper path safety
        run: ./tests/test-kernel-docker-wrapper-path-safety.sh

      - name: Test immutable APT provenance and envelope guards
        run: python3 ./tests/test-sp11-immutable-apt-provenance.py

      - name: Test historical kernel-comparator hostile fixtures
        run: python3 ./tests/test-sp11-kernel-build-comparison.py --synthetic-only

      - name: Test raw kernel matched-pair comparator hostile fixtures
        run: python3 ./tests/test-sp11-kernel-raw-build-comparison.py

      - name: Test live-image release source gate
        run: ./tests/test-sp11-image-release-source-gate.sh

      - name: Test committed live-image support binding
        run: ./tests/test-sp11-support-tree-binding.sh

      - name: Test live-image path safety
        run: ./tests/test-sp11-live-image-path-safety.sh

      - name: Test raw live-image binding extractor
        run: ./tests/test-sp11-image-binding-extractor.sh

      - name: Test module-signature package scanner
        run: ./tests/test-sp11-module-signature-policy.sh

      - name: Test installed Stubble loose-DTB retirement
        run: sudo ./tests/test-install-sp11-support-stubble-retirement.sh

      - name: Test pinned audio topology source guard
        run: ./tests/test-sp11-audio-topology.sh

      - name: Check tracked whitespace
        run: git diff --check "$(git hash-object -t tree /dev/null)" HEAD --

      - name: Smoke-test patches against pinned kernel source
        run: ./scripts/test-sp11-kernel-patches.sh

      - name: Exercise pinned kernel build command
        run: |
          . config/kernel-baselines/7.2-rc5-jg-0.env
          ./scripts/build-sp11-qcom-x1e-kernel-docker.sh \
            --source git \
            --git-url "$SP11_KERNEL_UPSTREAM_URL" \
            --git-branch "$SP11_KERNEL_UPSTREAM_REF" \
            --expected-source-commit "$SP11_KERNEL_UPSTREAM_COMMIT" \
            --image "$SP11_KERNEL_DOCKER_IMAGE" \
            --platform "$SP11_KERNEL_DOCKER_PLATFORM" \
            --patch-dirs "$SP11_KERNEL_PATCH_DIRS" \
            --build-target "$SP11_KERNEL_BUILD_TARGET" \
            --release-build \
            --dry-run
