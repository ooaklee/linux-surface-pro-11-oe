# SPDX-License-Identifier: GPL-2.0-only

name: Test SP11 iptsd integration

on:
  pull_request:
    paths:
      - ".github/workflows/iptsd-integration-tests.yml"
      - "meta-sp11/recipes-support/iptsd-sp11/**"
      - "scripts/build-sp11-iptsd-docker.sh"
      - "scripts/build-sp11-live-usb-image.sh"
      - "scripts/install-sp11-iptsd.sh"
      - "scripts/install-sp11-support.sh"
      - "scripts/validate-sp11-iptsd-payload.sh"
      - "tests/test-iptsd-integration.sh"
      - "userspace/iptsd-sp11/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/iptsd-integration-tests.yml"
      - "meta-sp11/recipes-support/iptsd-sp11/**"
      - "scripts/build-sp11-iptsd-docker.sh"
      - "scripts/build-sp11-live-usb-image.sh"
      - "scripts/install-sp11-iptsd.sh"
      - "scripts/install-sp11-support.sh"
      - "scripts/validate-sp11-iptsd-payload.sh"
      - "tests/test-iptsd-integration.sh"
      - "userspace/iptsd-sp11/**"

permissions:
  contents: read

jobs:
  integration:
    name: Integration policy and templates
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out the support repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install integration-test dependency
        run: |
          if ! command -v rg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes ripgrep
          fi

      - name: Run the SP11 iptsd integration checks
        run: bash tests/test-iptsd-integration.sh
