name: Build SP11 kernel

on:
  workflow_dispatch:
    inputs:
      git-url:
        description: "Kernel git URL"
        required: true
        default: "https://github.com/ooaklee/linux_ms_dev_kit-sp11.git"
        type: string
      git-branch:
        description: "Kernel git branch or tag"
        required: true
        default: "sp11/integration-7.2-rc"
        type: string
      patch-dirs:
        description: "Space-separated patch directories (relative to repo root); empty for in-tree integration builds"
        required: false
        default: ""
        type: string
      docker-image:
        description: "Docker image for the build container"
        required: false
        default: "ubuntu:26.04"
        type: string
      build-target:
        description: "Debian build target"
        required: false
        default: "binary-indep binary-qcom-x1e"
        type: string
      jobs:
        description: "Parallel build jobs"
        required: false
        default: "8"
        type: string
      release:
        description: "Create a GitHub release after a successful build"
        required: false
        default: false
        type: boolean
      release-name:
        description: "Release tag name (auto-derived if empty)"
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: sp11-kernel-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build kernel
    runs-on: ubuntu-24.04
    timeout-minutes: 600

    outputs:
      release-name: ${{ steps.release-assets.outputs.release-name }}

    steps:
      - name: Check out the support repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx (for ARM64 emulation)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build the kernel
        run: |
          ./scripts/build-sp11-qcom-x1e-kernel-docker.sh \
            --source git \
            --git-url "${{ inputs.git-url }}" \
            --git-branch "${{ inputs.git-branch }}" \
            --image "${{ inputs.docker-image }}" \
            --patch-dirs "${{ inputs.patch-dirs }}" \
            --build-target "${{ inputs.build-target }}" \
            --work-dir build/docker-sp11-kernel \
            --linux-work-volume sp11-kernel-build-ci \
            --copy-to-payload \
            --reset-source \
            --jobs "${{ inputs.jobs }}"

      - name: Upload .deb artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-debs
          path: payload/kernel-debs/*.deb
          if-no-files-found: error
          retention-days: 30

      - name: Prepare release assets
        id: release-assets
        if: ${{ inputs.release }}
        run: |
          patch_args=()
          for d in ${{ inputs.patch-dirs }}; do
            patch_args+=(--patch-dir "$d")
          done
          ./scripts/prepare-sp11-kernel-release-assets.sh \
            --kernel-debs-dir payload/kernel-debs \
            --artifacts-dir build/docker-sp11-kernel/artifacts \
            "${patch_args[@]}" \
            --source-url "${{ inputs.git-url }}" \
            --source-branch "${{ inputs.git-branch }}" \
            --docker-image "${{ inputs.docker-image }}" \
            --allow-missing-source \
            --allow-dirty \
            ${{ inputs.release-name != '' && format('--release-name "{0}"', inputs.release-name) || '' }}

          # Extract the release name that the script derived
          release_dir="build/release"
          if [ -d "$release_dir" ]; then
            release_name="$(find "$release_dir" -maxdepth 1 -mindepth 1 -type d -printf '%f\n' | sort | tail -1)"
            echo "release-name=$release_name" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        if: ${{ inputs.release && steps.release-assets.outputs.release-name != '' }}
        with:
          name: release-assets
          path: build/release/${{ steps.release-assets.outputs.release-name }}/*
          retention-days: 90

  release:
    name: Create GitHub release
    runs-on: ubuntu-24.04
    needs: build
    if: ${{ inputs.release && needs.build.outputs.release-name != '' }}
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - name: Check out the support repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: release-assets

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          release_name="${{ needs.build.outputs.release-name }}"
          target_commit="${{ github.sha }}"
          release_dir="release-assets"

          # Find RELEASE-NOTES.md and the asset files
          notes_file=""
          assets=()
          for f in "$release_dir"/*; do
            case "$(basename "$f")" in
              RELEASE-NOTES.md) notes_file="$f" ;;
              *.deb|*.ddeb|*.tar.xz|*.manifest|*.sha256|*.txt|SHA256SUMS) assets+=("$f") ;;
            esac
          done

          args=(--target "$target_commit" --prerelease --title "$release_name")
          if [ -n "$notes_file" ]; then
            args+=(--notes-file "$notes_file")
          fi

          gh release create "$release_name" "${args[@]}" "${assets[@]}"
