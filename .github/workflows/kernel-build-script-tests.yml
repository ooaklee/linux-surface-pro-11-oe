# SPDX-License-Identifier: GPL-2.0-only

name: Test kernel build scripts

on:
  pull_request:
    paths:
      - ".github/workflows/kernel-build-script-tests.yml"
      - "docs/how-to/how-to-release-kernel-artifacts.md"
      - "scripts/build-sp11-qcom-x1e-kernel.sh"
      - "scripts/build-sp11-qcom-x1e-kernel-docker.sh"
      - "scripts/prepare-sp11-kernel-release-assets.sh"
      - "tests/test-kernel-patch-selection.sh"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/kernel-build-script-tests.yml"
      - "docs/how-to/how-to-release-kernel-artifacts.md"
      - "scripts/build-sp11-qcom-x1e-kernel.sh"
      - "scripts/build-sp11-qcom-x1e-kernel-docker.sh"
      - "scripts/prepare-sp11-kernel-release-assets.sh"
      - "tests/test-kernel-patch-selection.sh"

permissions:
  contents: read

jobs:
  patch-selection:
    name: Patch selection and provenance
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out the support repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check shell syntax
        run: |
          for script in \
            scripts/build-sp11-qcom-x1e-kernel.sh \
            scripts/build-sp11-qcom-x1e-kernel-docker.sh \
            scripts/prepare-sp11-kernel-release-assets.sh \
            tests/test-kernel-patch-selection.sh
          do
            bash -n "$script"
          done

      - name: Test patch selection and release provenance
        run: bash tests/test-kernel-patch-selection.sh
